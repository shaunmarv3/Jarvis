[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-research-agent"
description = "Personal AI research agent in the terminal (LangGraph + Ollama/DeepSeek)"
requires-python = ">=3.12"
dynamic = ["version", "dependencies"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
packages = ["jarvis", "jarvis.tools"]

[tool.setuptools.dynamic]
version = { attr = "jarvis.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
